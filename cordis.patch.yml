# dsh-connectors bundle layer.
# Mounts the Connectors service, remote MCP bridge, DSH Credential Store
# integration, and the Settings -> Connectors UI page.
#
# `name` must be the FULL package specifier as installed in the profile's
# node_modules. Quote it: an unquoted YAML scalar starting with `@` fails.
- insert:
    - id: connectors
      name: "@ai-workspace-lab/dsh-connectors"
      config:
        autoConnect: true
