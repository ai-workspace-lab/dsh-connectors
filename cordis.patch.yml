# dsh-nvidia-cloud-provider bundle layer.
# Registers the `nvidia-nim` provider route. All fields are optional —
# schema defaults apply.
#
# `name` must be the FULL package specifier as installed in the profile's
# node_modules. Quote it: an unquoted YAML scalar starting with `@` fails.
- insert:
    - id: llm-nvidia-nim
      name: "@ai-workspace-lab/dsh-nvidia-cloud-provider"
      config:
        apiKeyEnv: NVIDIA_API_KEY
